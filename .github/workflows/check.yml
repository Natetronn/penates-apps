name: Check
on:
  pull_request:
jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: App files are valid, and changed apps have a new version
        run: python3 scripts/build.py --validate --base "${{ github.event.pull_request.base.sha }}"
